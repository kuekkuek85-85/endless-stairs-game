name: Codex 코드 리뷰

# PR이 열리거나 새 커밋이 푸시될 때마다 Codex가 변경 사항을 리뷰하고
# 결과를 PR 댓글로 남깁니다.
# 필요: 저장소 Settings → Secrets and variables → Actions 에 OPENAI_API_KEY 등록
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  codex:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: OPENAI_API_KEY 확인
        id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY secret이 없어 Codex 리뷰를 건너뜁니다."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      # 푸시마다 해당 커밋 자체를 리뷰하도록 merge ref가 아닌 head SHA를 체크아웃
      - name: Checkout
        if: steps.check.outputs.has_key == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Base 브랜치 가져오기
        if: steps.check.outputs.has_key == 'true'
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}

      - name: Codex 실행
        id: run_codex
        if: steps.check.outputs.has_key == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            당신은 이 저장소의 코드 리뷰어입니다. 한국어로 답하세요.

            리뷰 대상: PR #${{ github.event.pull_request.number }}
            - base: origin/${{ github.event.pull_request.base.ref }}
            - head: ${{ github.event.pull_request.head.sha }}
            - 직전 head(있다면): ${{ github.event.before }}

            1. `git diff origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }}` 로 PR 전체 변경을 보고,
               직전 head가 있으면 `git diff <직전 head> ${{ github.event.pull_request.head.sha }}` 로 이번 푸시에서 바뀐 부분을 중점적으로 보세요.
            2. 요구사항 문서는 저장소의 `docs/PRD.md` 입니다(있다면). PRD와 어긋나는 구현을 지적하세요.
            3. 다음을 우선 확인하세요:
               - 실제 버그(게임 판정, 게이지 계산, 입력 누락/중복, 메모리 누수, 이벤트 리스너 해제 누락)
               - 모바일 터치 반응성(pointerdown, 멀티터치, 확대/스크롤 방지)
               - Firestore 보안 규칙과 클라이언트 저장 로직의 일치 여부, 부정 기록 방어
               - 성능(60fps, 불필요한 React 리렌더, 캔버스 그리기 비용)
            4. 출력 형식:
               - 첫 줄에 한 줄 요약
               - `### 🔴 반드시 수정`, `### 🟡 권장`, `### 🟢 좋은 점` 섹션
               - 각 지적은 `파일:줄` 과 이유, 수정 제안을 포함
               - 문제가 없으면 "반드시 수정" 섹션에 "없음"이라고 쓰세요.

  post_feedback:
    needs: codex
    if: needs.codex.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 리뷰 결과를 PR 댓글로 게시
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 Codex 코드 리뷰 (\`${sha}\`)\n\n${process.env.CODEX_FINAL_MESSAGE}`,
            });
